<svg xmlns="http://www.w3.org/2000/svg" width="960" height="320" viewBox="0 0 960 320" font-family="Segoe UI, Calibri, Arial, sans-serif">
  <rect width="960" height="320" fill="#ffffff"/>

  <text x="480" y="30" text-anchor="middle" font-size="17" font-weight="600" fill="#0d1116">The audit-repair-re-audit loop</text>
  <text x="480" y="52" text-anchor="middle" font-size="12.5" fill="#5a6b7b">A11yAudit.cs measures · AccessibilityBuild.cs repairs by rule · A11yAudit.cs measures again</text>

  <!-- Step 1 -->
  <rect x="28" y="86" width="250" height="130" rx="8" fill="#f5f7f9" stroke="#c3ccd5" stroke-width="1.2"/>
  <rect x="28" y="86" width="250" height="26" rx="8" fill="#e7ecf1" stroke="#c3ccd5" stroke-width="1.2"/>
  <text x="153" y="104" text-anchor="middle" font-size="12.5" font-weight="600" fill="#0d1116">1  AUDIT — baseline</text>
  <text x="44" y="136" font-size="11.5" fill="#14181d">57 checks over 23 labels and 11 targets</text>
  <text x="44" y="156" font-size="11.5" fill="#14181d">C  contrast  4.5:1 / 3.0:1</text>
  <text x="44" y="174" font-size="11.5" fill="#14181d">L  label fit  height ≥ size × 1.12</text>
  <text x="44" y="192" font-size="11.5" fill="#14181d">T  touch     96 × 96 canvas px</text>
  <text x="44" y="210" font-size="11.5" font-weight="600" fill="#8c2e2e">45 passed · 10 failed · 2 not measurable</text>

  <!-- Arrow 1 -> 2 -->
  <line x1="278" y1="151" x2="336" y2="151" stroke="#4a6b8a" stroke-width="1.6"/>
  <polygon points="336,151 326,146 326,156" fill="#4a6b8a"/>
  <text x="307" y="143" text-anchor="middle" font-size="10" fill="#4a6b8a">failures</text>

  <!-- Step 2 -->
  <rect x="340" y="86" width="280" height="130" rx="8" fill="#f5f7f9" stroke="#c3ccd5" stroke-width="1.2"/>
  <rect x="340" y="86" width="280" height="26" rx="8" fill="#e7ecf1" stroke="#c3ccd5" stroke-width="1.2"/>
  <text x="480" y="104" text-anchor="middle" font-size="12.5" font-weight="600" fill="#0d1116">2  REPAIR — by rule, not by palette</text>
  <text x="356" y="136" font-size="11.5" fill="#14181d">contrast  fill × 0.97 in its own hue,</text>
  <text x="356" y="152" font-size="11.5" fill="#14181d">          re-measure until it clears</text>
  <text x="356" y="170" font-size="11.5" fill="#14181d">touch     raise from the top edge</text>
  <text x="356" y="188" font-size="11.5" fill="#14181d">layout    re-stack changed columns, 12 px gap</text>
  <text x="356" y="206" font-size="11.5" fill="#14181d">new       PausePanel/SoundButton, 320 × 96</text>

  <!-- Arrow 2 -> 3 -->
  <line x1="620" y1="151" x2="678" y2="151" stroke="#4a6b8a" stroke-width="1.6"/>
  <polygon points="678,151 668,146 668,156" fill="#4a6b8a"/>
  <text x="649" y="143" text-anchor="middle" font-size="10" fill="#4a6b8a">re-run</text>

  <!-- Step 3 -->
  <rect x="682" y="86" width="250" height="130" rx="8" fill="#f5f7f9" stroke="#c3ccd5" stroke-width="1.2"/>
  <rect x="682" y="86" width="250" height="26" rx="8" fill="#e7ecf1" stroke="#c3ccd5" stroke-width="1.2"/>
  <text x="807" y="104" text-anchor="middle" font-size="12.5" font-weight="600" fill="#0d1116">3  RE-AUDIT — after</text>
  <text x="698" y="136" font-size="11.5" fill="#14181d">60 checks: the same set plus 3 the</text>
  <text x="698" y="152" font-size="11.5" fill="#14181d">new SOUND control brings with it</text>
  <text x="698" y="176" font-size="11.5" fill="#14181d">delta.txt pairs 10 of 10 failures,</text>
  <text x="698" y="192" font-size="11.5" fill="#14181d">0 unmatched</text>
  <text x="696" y="210" font-size="10.5" font-weight="600" fill="#267333">58 passed · 0 failed · 2 not measurable</text>

  <!-- Loop back -->
  <path d="M807 216 L807 262 L153 262 L153 216" fill="none" stroke="#8c2e2e" stroke-width="1.4" stroke-dasharray="5 4"/>
  <polygon points="153,216 148,226 158,226" fill="#8c2e2e"/>
  <rect x="346" y="249" width="268" height="26" rx="4" fill="#ffffff" stroke="#ffffff"/>
  <text x="480" y="267" text-anchor="middle" font-size="11" fill="#8c2e2e">idempotence: fingerprint 4C3E2E0C → 4C3E2E0C</text>

  <text x="480" y="300" text-anchor="middle" font-size="10.5" font-style="italic" fill="#5a6b7b">Every value in this diagram is read from Evidence/a11y_baseline.log, a11y_after.log and a11y_delta.txt.</text>
</svg>
